<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>시뮬라크월드: PvP 아레나</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles/main.css?v=20260513-2">
  </head>
  <body class="lobby-open">
    <canvas id="world" aria-label="시뮬라크월드 PvP 아레나"></canvas>

    <main class="hud" aria-label="시뮬라크월드 조작 UI">
      <section id="arenaHud" class="arena-hud" aria-label="아레나 점수">
        <div class="arena-score red"><span>RED</span><strong id="redScore">0</strong></div>
        <div class="arena-center">
          <strong data-brand-name>시뮬라크월드: PvP 아레나</strong>
          <span id="arenaStatus">대전 준비 중</span>
        </div>
        <div class="arena-score blue"><span>BLUE</span><strong id="blueScore">0</strong></div>
      </section>

      <section class="arena-player-panel" aria-label="플레이어 전투 상태">
        <div><span id="arenaTeamLabel">RED</span><strong id="arenaRoleLabel">공격</strong></div>
        <div class="arena-hp"><span id="arenaHpBar"></span></div>
        <small id="arenaHpText">120 / 120</small>
      </section>

      <section class="arena-hotbar" aria-label="아레나 액션">
        <button id="arenaAttackButton" type="button"><span>Space</span>공격</button>
        <button id="arenaSkillButton" type="button"><span>Q</span>스킬</button>
      </section>

      <div class="quick-actions" aria-label="빠른 메뉴">
        <button id="chatToggle" class="chat-toggle active" type="button">채팅</button>
        <button id="voiceToggle" class="voice-toggle" type="button">음성</button>
        <button id="rankingToggle" class="ranking-toggle active" type="button">랭킹</button>
      </div>

      <aside class="ranking-panel" aria-label="랭킹">
        <div class="ranking-head"><strong>랭킹</strong><span>좋아요</span></div>
        <ol id="rankingList" class="ranking-list"></ol>
      </aside>

      <section id="votePopup" class="vote-popup hidden" aria-label="플레이어 추천">
        <strong id="voteTargetName">플레이어</strong>
        <div>
          <button id="voteLikeButton" type="button">좋아요</button>
          <button id="voteDislikeButton" type="button">비추</button>
          <button id="voteCloseButton" type="button">닫기</button>
        </div>
        <p id="voteHint" class="vote-hint">비추 3개 이상이면 해당 플레이어의 그림이 삭제됩니다.</p>
      </section>

      <section class="mobile-controls" aria-label="모바일 이동">
        <div id="joystickBase" class="joystick-base">
          <div id="joystickKnob" class="joystick-knob"></div>
        </div>
      </section>

      <aside class="chat" aria-label="채팅">
        <div id="chatLog" class="chat-log" aria-live="polite"></div>
        <form id="chatForm" class="chat-form">
          <input id="chatInput" type="text" maxlength="240" placeholder="메시지 입력" autocomplete="off">
          <button type="submit">전송</button>
        </form>
      </aside>
    </main>

    <section id="lobby" class="lobby" aria-label="시작 로비">
      <form id="lobbyForm" class="lobby-panel">
        <div>
          <p class="lobby-kicker">시뮬라크월드</p>
          <h1>PvP 아레나 입장</h1>
        </div>

        <label class="lobby-field">
          <span>이름</span>
          <input id="lobbyNameInput" type="text" maxlength="18" autocomplete="nickname">
        </label>

        <section class="arena-role-picker" aria-label="역할 선택">
          <div>
            <span>역할 선택</span>
            <strong id="arenaRolePickLabel">공격</strong>
          </div>
          <div id="arenaRoleButtons" class="arena-role-buttons"></div>
        </section>

        <section class="skin-editor" aria-label="스킨 편집">
          <div class="skin-editor-head">
            <span>스킨</span>
            <div class="skin-custom-panel">
              <button id="skinEraserButton" type="button">지우개</button>
              <button id="skinClearButton" type="button">전체 지우기</button>
              <button id="skinDefaultButton" type="button">기본</button>
            </div>
          </div>

          <div id="skinPresets" class="skin-presets" aria-label="기본 스킨"></div>

          <div class="skin-workbench skin-custom-panel">
            <canvas id="skinCanvas" width="32" height="32" aria-label="스킨 편집 캔버스"></canvas>
            <div class="skin-preview-wrap">
              <span>미리보기</span>
              <canvas id="skinPreview" width="32" height="32" aria-label="스킨 미리보기"></canvas>
            </div>
          </div>

          <div class="skin-options skin-custom-panel">
            <label class="skin-color-picker">
              <span>색상</span>
              <input id="skinColorInput" type="color">
            </label>
            <div class="skin-size-picker">
              <span>도트</span>
              <div id="skinBrushSizes" class="skin-brush-sizes" aria-label="스킨 브러시 크기"></div>
            </div>
          </div>

          <div id="skinPalette" class="skin-palette skin-custom-panel" aria-label="스킨 색상"></div>

          <div class="skin-editor-actions skin-custom-panel">
            <button id="skinLoadButton" type="button">PNG 불러오기</button>
            <button id="skinSaveButton" type="button">PNG 저장</button>
            <input id="skinFileInput" type="file" accept="image/png,image/webp,image/jpeg" hidden>
          </div>
        </section>

        <section class="room-list" aria-label="방 목록">
          <div class="room-list-head">
            <span>방 목록</span>
            <span id="lobbyRoomStatus">불러오는 중</span>
          </div>
          <button id="lobbyRoomCard" class="room-card" type="submit">
            <span>
              <strong>PvP 아레나</strong>
              <small>스킨으로 팀전을 하는 전투 월드</small>
            </span>
            <span id="lobbyRoomCount" class="room-count">0/50</span>
            <span class="room-enter">입장</span>
          </button>
        </section>
      </form>
    </section>

    <script type="module" src="./src/main.js?v=20260513-2"></script>
  </body>
</html>
